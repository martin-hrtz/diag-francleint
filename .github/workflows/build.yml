name: Fabriquer l'appli

# Se lance tout seul à chaque modification, ou à la main depuis l'onglet « Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
      HAS_KEY: ${{ secrets.FR_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Polices
        run: |
          mkdir -p app/src/main/assets/www/fonts
          curl -fsSL -o app/src/main/assets/www/fonts/PlusJakartaSans.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            || echo "Police introuvable : la police système sera utilisée."
          mkdir -p francleint/src/main/assets/www/fonts
          cp app/src/main/assets/www/fonts/PlusJakartaSans.ttf francleint/src/main/assets/www/fonts/ || true
          curl -fsSL -o francleint/src/main/assets/www/fonts/InstrumentSans.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/instrumentsans/InstrumentSans%5Bwdth%2Cwght%5D.ttf" \
            || echo "Police introuvable : la police système sera utilisée."

      - name: Clé de signature fixe (secrets)
        if: env.HAS_KEY == 'true'
        env:
          FR_KEYSTORE_B64: ${{ secrets.FR_KEYSTORE_B64 }}
        run: |
          echo "$FR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/francleint.keystore"
          echo "FR_KEYSTORE=$RUNNER_TEMP/francleint.keystore" >> "$GITHUB_ENV"

      - name: Fabriquer l'APK
        env:
          FR_KS_PASS: ${{ secrets.FR_KS_PASS }}
        run: gradle assembleDebug --no-daemon

      - name: Renommer
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk diag-francleint.apk
          cp francleint/build/outputs/apk/debug/francleint-debug.apk francleint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks-francleint
          path: |
            diag-francleint.apk
            francleint.apk

      - name: Publier le lien de téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: francleint v1.${{ github.run_number }}
          files: |
            diag-francleint.apk
            francleint.apk
          make_latest: true

      # Copie publique des APK (le code reste privé) : dépôt « francleint-app »
      - name: Publier dans francleint-app
        if: env.HAS_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: martin-hrtz/francleint-app
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v1.${{ github.run_number }}
          name: francleint v1.${{ github.run_number }}
          files: |
            francleint.apk
          make_latest: true
