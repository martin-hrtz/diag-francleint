name: Fabriquer l'appli

# Se lance tout seul à chaque modification, ou à la main depuis l'onglet « Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Police Plus Jakarta Sans
        run: |
          mkdir -p app/src/main/assets/www/fonts
          curl -fsSL -o app/src/main/assets/www/fonts/PlusJakartaSans.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" \
            || echo "Police introuvable : la police système sera utilisée."

      - name: Fabriquer l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk diag-francleint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diag-francleint
          path: diag-francleint.apk

      - name: Publier le lien de téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Diag francleint v1.${{ github.run_number }}
          files: diag-francleint.apk
          make_latest: true
