plugins {
    id 'com.android.application'
}

// Numéro de version = numéro de fabrication GitHub (1, 2, 3…) : sert aux mises à jour dans l'appli.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'fr.francleint.os'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.francleint.os'
        minSdk 21
        // Les écrans visés tournent sous Android 9 : on cible l'API 28.
        targetSdk 28
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // Clé de signature FIXE (fournie par les secrets GitHub) : indispensable pour que
    // le bouton « Mises à jour » de l'appli puisse installer par-dessus l'ancienne version.
    signingConfigs {
        fixe {
            def ks = System.getenv('FR_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('FR_KS_PASS')
                keyAlias 'francleint'
                keyPassword System.getenv('FR_KS_PASS')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('FR_KEYSTORE')) signingConfig signingConfigs.fixe
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
