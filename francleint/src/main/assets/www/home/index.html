<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>francleint</title>
<style>
/* Base : maquette 1280×720, 1rem = 16 px à 720 px de haut */
@font-face { font-family: "Inst"; src: url("../fonts/InstrumentSans.ttf") format("truetype"); font-weight: 400 700; font-stretch: 75% 100%; }
:root {
  /* NUIT (défaut) — mêmes jetons que l'écran Ambiance */
  --bg: #040706; --surface: #0A0F0C; --surface-2: #111813; --line: #18211B;
  --ink: #C3CDC6; --ink-2: #7D8A82; --ink-3: #56625A; --accent: #2F6E4C; --accent-hi: #6FA787;
  --live: #3F8F63; --glow: rgba(63,143,99,.10);
  --ease: cubic-bezier(.22,1,.36,1);
}
body.jour {
  /* JOUR */
  --bg: #EEF0EB; --surface: #FFFFFF; --surface-2: #E6EAE5; --line: #D8DED7;
  --ink: #0E1511; --ink-2: #4A5750; --ink-3: #74817A; --accent: #2E7A52; --accent-hi: #2E7A52; --glow: rgba(46,122,82,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(100vh / 45); }
html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: "Inst", system-ui, sans-serif; user-select: none; transition: background 900ms var(--ease), color 900ms var(--ease); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; transition: transform 180ms var(--ease); }
button:active { transform: scale(.97); }
svg { display: block; }

.page { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding: 1.5rem 1.75rem 1.75rem; display: none;
  background-image: radial-gradient(56rem 32rem at 12% 0%, var(--glow), transparent 70%); }
.page.on { display: grid; }

/* ACCUEIL — Hallmark · macrostructure: Cockpit (rail + horloge + CarPlay + conduite) · même système que l'écran Ambiance */
#home { padding: 0; display: none; background-image: none; }
#home.on { display: block; }
#home .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 7.5rem; z-index: 5; background: var(--bg);
  transition: transform 420ms cubic-bezier(.22,1,.36,1), opacity 420ms cubic-bezier(.22,1,.36,1); }
#home .dash { position: absolute; top: 0; right: 0; bottom: 0; left: 0; padding-left: 8.75rem; transition: padding-left 420ms cubic-bezier(.22,1,.36,1); }
body.full #home .rail { transform: translateX(-100%); opacity: 0; pointer-events: none; }
body.full #home .dash { padding-left: 1.75rem; }
.rail { display: flex; flex-direction: column;  padding: 1.25rem .75rem; border-right: 1px solid var(--line); }
.mark { height: 3.25rem; display: flex; align-items: center; justify-content: center; margin-bottom: .5rem; }
.mark span { width: 2.75rem; height: 2.75rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.35rem; background: var(--surface-2); color: var(--ink);
  box-shadow: 0 0 0 2px var(--live), 0 0 1.25rem -.25rem var(--live); transition: box-shadow 700ms var(--ease); }
.tab { height: 4.6rem; border-radius: 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: center;  color: var(--ink-3); font-size: .95rem; font-weight: 600; }
.tab svg { width: 1.6rem; height: 1.6rem; stroke: currentColor; }
.tab.on { background: var(--surface-2); color: var(--ink); }
.tab:active { background: var(--surface-2); }
body.jour .tab.on { background: var(--surface); box-shadow: 0 1px 2px rgba(14,21,17,.06); }

.dash { min-width: 0; min-height: 0; padding: 1.25rem 1.75rem 1.25rem 1.25rem; display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; grid-gap: 1.25rem; gap: 1.25rem;
  background-image: radial-gradient(48rem 30rem at 0% 0%, var(--glow), transparent 70%); }
.clockbox { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding: .25rem .25rem 0; }
.status { display: flex; align-items: center;  font-size: 1.1rem; font-weight: 500; color: var(--ink-2); }
.status span { display: flex; align-items: center;  }
.status svg { width: 1.2rem; height: 1.2rem; stroke: var(--ink-2); }
.hello { font-size: 1.5rem; font-weight: 500; color: var(--ink-2); }
.hello b { color: var(--ink); font-weight: 600; }
.clock { margin-top: .25rem; font-size: 9.5rem; font-weight: 500; font-stretch: 75%; letter-spacing: -.02em; line-height: .9; font-variant-numeric: tabular-nums; }
.date { margin-top: .5rem; font-size: 1.4rem; font-weight: 500; color: var(--ink-2); }
.infos { margin-top: 1.75rem; display: flex;  }
.info { padding: 0 1.75rem; border-left: 1px solid var(--line); min-width: 0; }
.info:first-child { padding-left: 0; border-left: 0; }
.info span { display: flex; align-items: center;  font-size: 1rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.info span svg { width: 1.15rem; height: 1.15rem; stroke: var(--ink-2); }
.info b { display: flex; align-items: center;  margin-top: .35rem; font-size: 2rem; font-weight: 600; font-stretch: 80%; line-height: 1; white-space: nowrap; }
.info b small { font-size: 1.1rem; font-weight: 500; color: var(--ink-2); font-stretch: 100%; }
.info b i { width: .9rem; height: .9rem; border-radius: 50%; background: var(--live); box-shadow: 0 0 .8rem var(--live); flex: none; }

.now { border-radius: 1.5rem; background: var(--surface); border: 1px solid var(--line); padding: 1rem 1.25rem; display: flex; align-items: center;  min-width: 0; }
.art { width: 4.25rem; height: 4.25rem; border-radius: .9rem; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex: none; }
.art svg { width: 1.8rem; height: 1.8rem; stroke: var(--accent-hi); }
.track { flex: 1; min-width: 0; }
.track b { display: block; font-size: 1.4rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track span { display: block; margin-top: .2rem; font-size: 1.1rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl { width: 3.75rem; height: 3.75rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.ctl svg { width: 1.6rem; height: 1.6rem; stroke: var(--ink); }
.play { width: 4.75rem; height: 4.75rem; background: var(--ink); }
.play svg { stroke: var(--bg); width: 1.8rem; height: 1.8rem; }

.carplay { position: relative; overflow: hidden; border-radius: 1.5rem; background: var(--accent); color: #fff; padding: 1.75rem; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; min-height: 0; }
.carplay::before { content: ""; position: absolute; right: -30%; top: -45%; width: 30rem; height: 30rem; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.16), transparent 65%); pointer-events: none; }
.carplay .ico { width: 2.5rem; height: 2.5rem; stroke: #fff; position: relative; }
.cp-bottom { position: relative; display: flex; align-items: flex-end; justify-content: space-between; width: 100%;  }
.cp-title { display: block; font-size: 4.6rem; font-weight: 600; font-stretch: 85%; letter-spacing: -.02em; line-height: 1; }
.cp-sub { display: block; margin-top: .6rem; font-size: 1.15rem; font-weight: 500; color: rgba(255,255,255,.8); }
.arrow { width: 4.5rem; height: 4.5rem; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.arrow svg { width: 1.8rem; height: 1.8rem; stroke: var(--accent); }

.drive { border-radius: 1.5rem; background: var(--surface); border: 1px solid var(--line); padding: 1rem 1.25rem 1.1rem; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)) auto; grid-gap: 1rem; gap: 1rem; align-items: center; text-align: left; }
.drive .st span { display: block; font-size: 1rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.drive .st { align-self: start; }
.drive .st b { display: block; margin-top: .3rem; font-size: 2.6rem; font-weight: 600; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.drive .st b small { font-size: 1.1rem; color: var(--ink-2); margin-left: .1rem; font-weight: 600; }
.drive .st i { display: block; margin-top: .55rem; height: .35rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.drive .st i em { display: block; height: 100%; border-radius: inherit; background: var(--live); transform-origin: left; transform: scaleX(0); transition: transform 500ms var(--ease); }
.sport { display: flex; flex-direction: column; align-items: center;  font-size: .95rem; font-weight: 600; color: var(--ink-2); }
.sw2 { width: 4.5rem; height: 2.6rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background 240ms var(--ease); }
.sw2::after { content: ""; position: absolute; top: .3rem; left: .3rem; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--ink-2); transition: transform 240ms var(--ease), background 240ms var(--ease); }
.sw2.on { background: var(--accent); border-color: var(--accent); }
.sw2.on::after { transform: translateX(1.85rem); background: #fff; }

/* PAGES INTERNES */
.sub { grid-template-rows: 2.75rem minmax(0,1fr); grid-gap: 1.25rem; gap: 1.25rem; }
.sub header { display: flex; align-items: center; justify-content: space-between; }
.sub header button { height: 2.75rem; padding: 0 1.1rem; border-radius: 999px; border: 1px solid var(--line); font-size: 1.15rem; font-weight: 600; color: var(--ink-2); }
.sub h1 { font-size: 1.75rem; font-weight: 600; }
.grid { overflow-y: auto; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); grid-gap: 1rem; gap: 1rem; align-content: start; }
.app { height: 9rem; border-radius: 1.25rem; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center;  padding: 0 .5rem; }
.app img { width: 3.5rem; height: 3.5rem; border-radius: .875rem; }
.app span { font-size: 1.05rem; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.list { overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); grid-gap: 1rem; gap: 1rem; align-content: start; }
.item { min-height: 5.5rem; border-radius: 1.25rem; background: var(--surface); border: 1px solid var(--line); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between;  text-align: left; }
.item b { display: block; font-size: 1.3rem; font-weight: 600; }
.item span { display: block; margin-top: .2rem; font-size: 1.05rem; color: var(--ink-2); }
.item svg { width: 1.5rem; height: 1.5rem; stroke: var(--ink-2); flex: none; }
.pill { height: 2.6rem; padding: 0 1.1rem; border-radius: 999px; background: var(--accent); color: #fff; font-size: 1.05rem; font-weight: 600; display: inline-flex; align-items: center; flex: none; }
.toggle { width: 3.5rem; height: 2rem; border-radius: 999px; background: var(--surface-2); position: relative; flex: none; transition: background 200ms var(--ease); }
.toggle i { position: absolute; top: .25rem; left: .25rem; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--ink-2); transition: transform 200ms var(--ease), background 200ms var(--ease); }
.toggle.on { background: var(--accent); }
.toggle.on i { transform: translateX(1.5rem); background: #fff; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } }

/* ───── Bienvenue v3 : « Bonsoir Martin » qui se révèle comme une mise au point (flou → net, interlettrage qui se resserre),
   un reflet de lumière passe sur le prénom, une lueur douce monte du bas. 3,4 s. ───── */
#welcomeFx { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100; background: #030504; display: none; align-items: center; justify-content: center; overflow: hidden; }
#welcomeFx.on { display: flex; animation: hl-out 600ms cubic-bezier(.65,0,.35,1) 2850ms forwards; }
#welcomeFx .hl-glow { position: absolute; left: 50%; bottom: -38rem; width: 80rem; height: 56rem; margin-left: -40rem; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(79,191,133,.42), rgba(79,191,133,.10) 55%, transparent 100%); opacity: 0; transform: translateY(6rem) scale(.85); }
#welcomeFx.on .hl-glow { animation: hl-glow 2600ms cubic-bezier(.22,1,.36,1) 80ms forwards; }
#welcomeFx .hl-stage { position: relative; }
#welcomeFx .hl-word { font-size: 8.5rem; font-weight: 600; font-stretch: 75%; line-height: 1; white-space: nowrap; color: #EDF2EE;
  letter-spacing: .14em; opacity: 0; filter: blur(16px); transform: translateY(.8rem); }
#welcomeFx.on .hl-word { animation: hl-focus 1400ms cubic-bezier(.16,1,.3,1) 220ms forwards; }
#welcomeFx .hl-word .g { color: #87958D; font-weight: 500; }
#welcomeFx .hl-word .n { background: linear-gradient(100deg, #EDF2EE 0%, #EDF2EE 40%, #FFFFFF 48%, #BFF0D4 50%, #FFFFFF 52%, #EDF2EE 60%, #EDF2EE 100%);
  background-size: 300% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
#welcomeFx.on .hl-word .n { animation: hl-sheen 1300ms cubic-bezier(.65,0,.35,1) 1250ms forwards; }
#welcomeFx .hl-brand { position: absolute; left: 0; right: 0; bottom: 2.5rem; text-align: center; font-size: 1.1rem; font-weight: 600; letter-spacing: .04em; color: #4F5B53; opacity: 0; }
#welcomeFx.on .hl-brand { animation: hl-fade 900ms ease-out 1400ms forwards; }
@keyframes hl-focus { to { opacity: 1; filter: blur(0); letter-spacing: -.02em; transform: translateY(0); } }
@keyframes hl-sheen { to { background-position: 0% 0; } }
@keyframes hl-glow { 45% { opacity: 1; } to { opacity: .75; transform: translateY(0) scale(1); } }
@keyframes hl-fade { to { opacity: 1; } }
@keyframes hl-out { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) {
  #welcomeFx.on .hl-word, #welcomeFx.on .hl-word .n, #welcomeFx.on .hl-glow, #welcomeFx.on .hl-brand { animation-duration: 1ms; animation-delay: 0ms; }
}

.item .pill { margin-top: 0; color: #fff; font-size: 1.05rem; }
.item .pstate { flex: none; margin-top: 0; height: 2.6rem; padding: 0 1.1rem; border-radius: 999px; font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; background: var(--accent); color: #fff; }
.item .pstate.ok { background: none; color: var(--accent-hi); padding: 0 .25rem; }

/* Pas de cadre orange au toucher / au focus */
*:focus { outline: none !important; }
button:focus { outline: none !important; }

/* Compat WebView Android 9 : remplace le « gap » des flex (non supporté) */
.rail > * + * { margin-top: .75rem; }
.rail > :only-child { margin-bottom: .75rem; }
.tab > * + * { margin-top: .3rem; }
.tab > :only-child { margin-bottom: .3rem; }
.status > * + * { margin-left: 1.5rem; }
.status > :only-child { margin-right: 1.5rem; }
.status span > * + * { margin-left: .5rem; }
.status span > :only-child { margin-right: .5rem; }
.info span > * + * { margin-left: .45rem; }
.info span > :only-child { margin-right: .45rem; }
.info b > * + * { margin-left: .6rem; }
.info b > :only-child { margin-right: 0; }
.info b small { margin-left: .5rem; }
.now > * + * { margin-left: 1rem; }
.now > :only-child { margin-right: 1rem; }
.cp-bottom > * + * { margin-left: 1rem; }
.cp-bottom > :only-child { margin-right: 1rem; }
.sport > * + * { margin-top: .45rem; }
.sport > :only-child { margin-bottom: .45rem; }
.app > * + * { margin-top: .75rem; }
.app > :only-child { margin-bottom: .75rem; }
.item > * + * { margin-left: 1rem; }
.item > :only-child { margin-right: 1rem; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
</svg>

<!-- ACCUEIL -->
<section class="page on" id="home">
  <nav class="rail" aria-label="Raccourcis">
    <div class="mark"><span>f</span></div>
    <button class="tab on" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>Accueil</button>
    <button class="tab" data-open="radio"><svg><use href="#i-radio"/></svg>Radio</button>
    <button class="tab" data-open="camera"><svg><use href="#i-cam"/></svg>Caméra</button>
    <button class="tab" data-open="ambiance"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>Ambiance</button>
    <button class="tab" data-page="apps"><svg><use href="#i-apps"/></svg>Applis</button>
    <div style="flex:1"></div>
    <button class="tab" data-page="settings"><svg><use href="#i-gear"/></svg>Réglages</button>
  </nav>
  <div class="dash">
    <div class="clockbox">
      <div class="status">
        <span id="stPhone"><svg><use href="#i-bt"/></svg><em id="stPhoneTxt" style="font-style:normal">iPhone</em></span>
        <span id="stWifi"><svg><use href="#i-wifi"/></svg><em id="stWifiTxt" style="font-style:normal">—</em></span>
      </div>
      <div>
        <p class="hello" id="hello">Bonjour <b>Martin</b></p>
        <p class="clock" id="clock">--:--</p>
        <p class="date" id="date"></p>
      </div>
    </div>
    <button class="carplay" data-open="carplay">
      <span></span>
      <span class="cp-bottom">
        <span><span class="cp-title">CarPlay</span></span>

    <button class="item" id="autoCp"><span><b>CarPlay au démarrage</b><span>S'ouvre tout seul quand tu démarres</span></span><span class="toggle" id="autoCpT"><i></i></span></button>
    <button class="item" data-open="media"><span><b>Afficher le morceau</b><span id="mediaTxt">Autoriser francleint à lire le titre</span></span><svg><use href="#i-chev"/></svg></button>

    <button class="item" id="upd"><span><b>Mises à jour</b><span id="updTxt">Vérifier</span></span><span class="pill" id="updBtn">Vérifier</span></button>
    <button class="item" data-open="android"><span><b>Réglages Android</b><span>Tous les paramètres</span></span><svg><use href="#i-chev"/></svg></button>

<script>
(function () {
  var NATIVE = typeof window.Home !== 'undefined';
  var $ = function (id) { return document.getElementById(id); };
  var JOURS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var current = 'home';

  function show(id) {
    current = id;
    if (id !== 'home') document.body.classList.remove('full'); else wake();
    [].forEach.call(document.querySelectorAll('.page'), function (p) { p.classList.toggle('on', p.id === id); });
    if (id === 'apps') loadApps();
    if (id === 'perms' || id === 'settings') refreshPerms();
  }
  var PERM_KEYS = ['p_install', 'media', 'p_write', 'p_overlay', 'p_location', 'p_battery', 'home'];
  function refreshPerms() {
    var p = {}; try { p = NATIVE ? JSON.parse(Home.perms()) : { p_install: true, media: true, p_write: false }; } catch (e) { }
    var n = 0;
    PERM_KEYS.forEach(function (k) {
      var el = $('ps_' + k), ok = !!p[k]; if (ok) n++;
      if (el) { el.textContent = ok ? 'Activé ✓' : 'Activer'; el.className = 'pstate' + (ok ? ' ok' : ''); }
    });
    $('permsTxt').textContent = n === PERM_KEYS.length ? 'Tout est activé ✓' : (PERM_KEYS.length - n) + ' à activer';
  }
  window.onBack = function () { if (current !== 'home') show('home'); };
  window.onHome = function () { if (current === 'perms' || current === 'settings') refreshPerms(); else show('home'); tick(); };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date(), h = d.getHours();
    $('clock').textContent = pad(h) + ':' + pad(d.getMinutes());
    $('date').textContent = JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];
    $('hello').innerHTML = (h >= 5 && h < 12 ? 'Bonjour' : h >= 12 && h < 18 ? 'Bon après-midi' : 'Bonsoir') + ' <b>Martin</b>';
  }

  // Lever / coucher du soleil (formules NOAA simplifiées, hors ligne)
  function sunTimes(lat, lon, d) {
    var start = new Date(d.getFullYear(), 0, 0), n = Math.floor((d - start) / 864e5);
    var g = 2 * Math.PI / 365 * (n - 1);
    var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var la = lat * Math.PI / 180;
    var ha = Math.acos(Math.cos(90.833 * Math.PI / 180) / (Math.cos(la) * Math.cos(dec)) - Math.tan(la) * Math.tan(dec)) * 180 / Math.PI;
    function at(min) { return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0) + min * 60000); }
    return { rise: at(720 - 4 * (lon + ha) - eq), set: at(720 - 4 * (lon - ha) - eq) };
  }

  // Barre de gauche : disparaît après 8 s sans toucher, un toucher la fait revenir (ce toucher ne déclenche rien d'autre)
  var idleT = null;
  function wake() { document.body.classList.remove('full'); clearTimeout(idleT); idleT = setTimeout(function () { if (current === 'home') document.body.classList.add('full'); }, 8000); }
  var swallow = false;
  document.addEventListener('pointerdown', function (e) {
    if (document.body.classList.contains('full') && current === 'home') { swallow = true; e.preventDefault(); }
    wake();
  }, true);
  document.addEventListener('click', function (e) { if (swallow) { swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
  wake();

  function status() {
    if (!NATIVE) { var q = location.search; return { weather: /night/.test(q) ? 'pluie' : 'dégagé', temp: /night/.test(q) ? 9 : 17, lat: 47.24, lon: 6.02, context: /night/.test(q) ? 'conduite' : 'jour', ambient: /night/.test(q) ? 4 : 60, phone: true, wifi: '5 GHz', mediaAllowed: true, title: 'Nuit blanche', artist: 'Lomepal', playing: true, autoCarplay: true, speed: 72, power: /night/.test(q) ? 62 : 18, sport: true, ledColor: /night/.test(q) ? '#9B2BFF' : '#2B5BFF' }; }
    try { return JSON.parse(Home.status()); } catch (e) { return {}; }
  }

  function refresh() {
    var s = status();
    var h = new Date().getHours();
    var jour = s.ambient >= 0 ? s.ambient >= 25 : (h >= 8 && h < 19);
    document.body.classList.toggle('jour', jour);
    if (s.ledColor) document.documentElement.style.setProperty('--live', s.ledColor);
    $('dSpeed').innerHTML = s.speed >= 0 ? s.speed + '<small>km/h</small>' : '—';
    $('dEff').innerHTML = s.sport === false ? 'off' : (s.power || 0) + '<small>%</small>';
    $('dEffBar').style.transform = 'scaleX(' + ((s.sport === false ? 0 : (s.power || 0)) / 100) + ')';
    $('dAmb').innerHTML = s.ambient >= 0 ? s.ambient + '<small>%</small>' : '—';
    $('sportSw').classList.toggle('on', s.sport !== false);
    $('stPhoneTxt').textContent = s.phone ? 'iPhone' : 'Pas de téléphone';
    $('stWifi').style.display = s.wifi ? 'flex' : 'none';
    $('stWifiTxt').textContent = s.wifi || '';
    if (s.title) {
      $('title').textContent = s.title;
      $('artist').textContent = s.artist || '';
    } else {
      $('title').textContent = 'Rien en lecture';
      $('artist').textContent = s.mediaAllowed ? 'Lance CarPlay pour écouter' : 'Réglages › Afficher le morceau';
    }
    $('playIcon').setAttribute('href', s.playing ? '#i-pause' : '#i-playtri');
    $('autoCpT').classList.toggle('on', !!s.autoCarplay);
    $('mediaTxt').textContent = s.mediaAllowed ? 'Autorisé ✓' : 'Autoriser francleint à lire le titre';
  }

  var appsLoaded = false;
  function loadApps() {
    if (appsLoaded) return;
    var list = [];
    try { list = NATIVE ? JSON.parse(Home.apps()) : []; } catch (e) { }
    var html = '';
    list.forEach(function (a) {
      html += '<button class="app" data-pkg="' + a.pkg + '">' + (a.icon ? '<img alt="" src="' + a.icon + '">' : '') + '<span>' + a.name.replace(/</g, '&lt;') + '</span></button>';
    });
    $('appGrid').innerHTML = html || '<p class="hello">Aucune appli trouvée</p>';
    appsLoaded = true;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.page) show(t.dataset.page);
    else if (t.dataset.open) { if (NATIVE) Home.open(t.dataset.open); }
    else if (t.dataset.media) { if (NATIVE) Home.media(t.dataset.media); setTimeout(refresh, 400); }
    else if (t.dataset.pkg) { if (NATIVE) Home.launch(t.dataset.pkg); }
    else if (t.id === 'upd') { if (NATIVE) { if ($('updBtn').textContent === 'Installer') Home.updateInstall(); else Home.updateCheck(); updStart(); } }
    else if (t.id === 'sportSw') { var sp = !t.classList.contains('on'); if (NATIVE) Home.setSport(sp); t.classList.toggle('on', sp); }
    else if (t.id === 'autoCp') { var on = !$('autoCpT').classList.contains('on'); if (NATIVE) Home.setAutoCarplay(on); $('autoCpT').classList.toggle('on', on); }
  });

  var updTimer = null;
  function updRefresh() {
    if (!NATIVE) return;
    var u = {}; try { u = JSON.parse(Home.updateStatus()); } catch (e) { }
    var txt = u.state || ('Version 1.' + u.current);
    if (u.progress >= 0) txt = 'Téléchargement… ' + u.progress + ' %';
    $('updTxt').textContent = txt;
    $('updBtn').textContent = u.available ? 'Installer' : 'Vérifier';
  }
  function updStart() { clearInterval(updTimer); updTimer = setInterval(updRefresh, 700); setTimeout(function () { clearInterval(updTimer); }, 120000); }

  tick(); refresh(); updRefresh();
  setInterval(tick, 5000);
  setInterval(refresh, 2000);
  setInterval(function () { if (current === 'perms') refreshPerms(); }, 1500);
})();
</script>
